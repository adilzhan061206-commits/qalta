<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қалта</title>
<meta name="description" content="Тегін жеке бюджет: шығын, кіріс, жинақ мақсаттары және айлық талдау.">
<meta name="theme-color" content="#e0313a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Қалта">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#f6f2f2; --surface:#ffffff; --surface-2:#f1eaea; --line:#e7dddd;
  --text:#1e1718; --muted:#76696b; --faint:#a4979a;
  --accent:#e0313a; --accent-2:#b81f29; --accent-soft:#fde6e7; --on-accent:#ffffff;
  --pos:#0c7f45; --neg:#c62f35; --warn:#b86e00; --warn-soft:#fff1d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s-other:#a7a09e;
  --inc:#1baf7a; --exp:#eb6834;
  --grid:#ece5e5; --axis:#cfc4c5;
  --shadow:0 1px 2px rgba(60,20,24,.06),0 6px 24px rgba(60,20,24,.06);
  --r:18px;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131011; --surface:#1d1819; --surface-2:#282223; --line:#342c2d;
    --text:#f4eeee; --muted:#a8999c; --faint:#716567;
    --accent:#ff4d55; --accent-2:#e0313a; --accent-soft:#3a1c1f; --on-accent:#ffffff;
    --pos:#3fcf8e; --neg:#ff6b70; --warn:#f2b441; --warn-soft:#3a2d12;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#1f9a1f; --s7:#9085e9; --s-other:#6f6869;
    --inc:#199e70; --exp:#d95926;
    --grid:#2a2324; --axis:#403738;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131011; --surface:#1d1819; --surface-2:#282223; --line:#342c2d;
  --text:#f4eeee; --muted:#a8999c; --faint:#716567;
  --accent:#ff4d55; --accent-2:#e0313a; --accent-soft:#3a1c1f; --on-accent:#ffffff;
  --pos:#3fcf8e; --neg:#ff6b70; --warn:#f2b441; --warn-soft:#3a2d12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#1f9a1f; --s7:#9085e9; --s-other:#6f6869;
  --inc:#199e70; --exp:#d95926;
  --grid:#2a2324; --axis:#403738;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* iPhone: экраннан кең элемент бүкіл бетті кішірейтіп жібермесін */
html,body{max-width:100%;overflow-x:clip}
.stack>*,.grid2>*,.section>*,.list>*,.card{min-width:0}
/* Экранға қосылған қосымшада сағат/батарея жолағының астына мазмұн кірмесін */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-disp);letter-spacing:-.01em}

/* Layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{padding-inline:16px;padding-block:14px 120px;max-width:1080px;width:100%;margin-inline:auto;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#f0545b,#c81e28);display:grid;place-items:center;color:#fff;font:700 16px var(--f-disp);box-shadow:0 4px 12px rgba(200,30,40,.3)}
.brand b{font:700 17px var(--f-disp);letter-spacing:-.01em}
.page-title{font:700 20px var(--f-disp);letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--pos)} .sync.err i{background:var(--neg)} .sync.busy i{background:var(--warn)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(224,49,58,.4);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:0 8px 18px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:10px 12px;color:var(--text)}
  .side .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side .add-btn{margin-top:14px}
  .tabbar,.fab{display:none}
  .main{padding-block:26px 60px;padding-inline:32px}
  .topbar .logo{display:none}
}

/* Surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.goals-grid>:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:900px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px;font-weight:700}
.sec-h .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#ff6b70 0%,#e0313a 42%,#a9161f 100%);box-shadow:0 12px 32px rgba(190,30,40,.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.45),rgba(255,255,255,.08) 60%,transparent 70%);pointer-events:none}
.hero .lbl{font-size:13px;opacity:.85;font-weight:500}
.hero .big{font:700 clamp(30px,8vw,40px)/1.1 var(--f-disp);margin:4px 0 14px;letter-spacing:-.02em}
.hero-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.hero-row div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-width:0}
.hero-row small{display:block;font-size:11.5px;opacity:.85}
.hero-row b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hero-day{margin-top:12px;font-size:13.5px;position:relative;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero-day b{font-size:15px}

/* Accounts strip */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:0 0 auto;min-width:148px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.acc .ic{font-size:20px}
.acc small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.acc b{font-size:16px}
.acc.add{display:grid;place-items:center;color:var(--accent);font-weight:600;min-width:110px;border-style:dashed}

/* Budget-OK style bubbles */
.bubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px 2px}
@media (min-width:900px){.bubs{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}
.bub{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;min-width:0;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub[data-drag]{touch-action:none;cursor:grab;-webkit-user-drag:none}
body.dragging *{-webkit-user-select:none;user-select:none}
.bub-c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface);box-shadow:var(--shadow);position:relative;transition:transform .15s}
.bub.inc .bub-c{background:color-mix(in srgb,var(--pos) 15%,var(--surface))}
.bub.acc .bub-c{background:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.bub.add .bub-c{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--accent);font-size:22px}
.bub-c.ring::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.bub-n{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.bub-v{font-size:12.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bub-v.zero{color:var(--faint);font-weight:500}
.bub-v.long{font-size:11px;letter-spacing:-.01em}
body.dragging{cursor:grabbing}
body.dragging .bub.target .bub-c{outline:2px dashed var(--faint);outline-offset:4px}
body.dragging .bub.drop-ok .bub-c{outline:3px solid var(--accent);outline-offset:4px;transform:scale(1.12)}
.bub.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.35);transform:translate(-50%,-60%) scale(1.08);border:3px solid var(--accent)}
.drag-hint{font-size:12.5px;color:var(--muted);text-align:center;padding:0 8px}
/* Split bills */
.person{display:grid;grid-template-columns:1fr 112px 34px;gap:8px;align-items:center}
.person.me{grid-template-columns:1fr 112px 34px}
.person .me-l{font-weight:600;padding-left:4px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;width:100%;border:0;background:none;text-align:left;border-radius:12px}
.chk + .chk{border-top:1px solid var(--line)}
.chk .box{flex:0 0 28px;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;transition:background .15s,border-color .15s}
.chk[aria-checked="true"] .box{background:var(--pos);border-color:var(--pos)}
.chk[aria-checked="true"] .nm{text-decoration:line-through;color:var(--muted)}
.chk .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Challenges */
.dots{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px}
.dd{display:block;aspect-ratio:1;border-radius:50%;background:var(--surface-2)}
.dd.ok{background:var(--pos)}
.dd.sp{background:color-mix(in srgb,var(--neg) 35%,var(--surface-2))}
.dd.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.wkgrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.wk{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.wk.done{background:var(--pos)}
.wk.now{box-shadow:0 0 0 2px var(--accent)}

/* Lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;padding:10px 4px;border:0;background:none;width:100%;text-align:left;border-radius:12px}
button.row:hover{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:19px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:14px 4px 4px;text-transform:uppercase;letter-spacing:.04em}

/* Controls */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--surface-2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 35%,transparent)}
.btn.danger.armed{background:var(--neg);color:#fff}
.btn.ghost.armed{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:600}
.inp{width:100%;max-width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:11px 12px;min-width:0;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inp.big{font:700 30px var(--f-disp);padding:12px 14px;letter-spacing:-.01em}
/* iOS Safari: date inputs ignore width:100% and grow taller unless reset */
input[type="date"].inp{-webkit-appearance:none;appearance:none;display:block;height:47px;line-height:23px;text-align:left}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"].inp::-webkit-datetime-edit{padding:0}
select.inp{height:47px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.frow > *{min-width:0}
.err{color:var(--neg);font-size:13px;min-height:1em}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:0;background:var(--surface);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;box-shadow:var(--shadow)}
.monthnav span{min-width:128px;text-align:center;font-weight:700}
.monthnav button:disabled{opacity:.35;cursor:default}

/* Progress */
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.thick{height:12px}
.bar > i.ok{background:var(--pos)} .bar > i.warn{background:var(--warn)} .bar > i.over{background:var(--neg)}

/* Category grid */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.cat{border:1px solid transparent;background:var(--surface-2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;line-height:1.2;text-align:center;min-width:0}
.cat span:first-child{font-size:21px}
.cat span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* Alerts */
.note{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;background:var(--surface-2);font-size:14px}
.note.warn{background:var(--warn-soft)}
.note.accent{background:var(--accent-soft)}
.note .mid{flex:1;min-width:0}
.banner{border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);color:var(--muted)}
.banner.demo{background:var(--warn-soft);color:var(--text)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600;display:block}
.kpi b{font-size:18px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart.wide text{font-size:14px}
@media (min-width:900px){.chart.wide text{font-size:12px}}
.donut-wrap{display:grid;grid-template-columns:1fr;gap:14px;align-items:center}
@media (min-width:520px){.donut-wrap{grid-template-columns:200px 1fr}}
.donut{max-width:220px;margin-inline:auto;width:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.catrow + .catrow{border-top:1px solid var(--line)}
.catrow .sw{width:12px;height:12px;border-radius:4px}
.catrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .v{text-align:right;white-space:nowrap}
.catrow .v small{display:block;font-size:11.5px;color:var(--muted)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));box-shadow:var(--shadow)}
.split{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.split > div{height:100%}
.rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rule-grid div{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.rule-grid small{display:block;font-size:11.5px;color:var(--muted)}
.rule-grid b{font-size:15px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.insight + .insight{border-top:1px solid var(--line)}
.insight .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)}

/* Goals */
.goal{display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;gap:12px;align-items:center}
.goal-top .ico{flex-basis:48px;width:48px;height:48px;font-size:24px;border-radius:14px}
.goal-top h3{font-size:16px}
.goal-nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.goal-nums b{font:700 20px var(--f-disp);letter-spacing:-.01em}
.goal-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.goal-meta b{color:var(--text);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,8,9,.45)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;position:sticky;top:-8px;background:var(--surface);z-index:1}
.sheet-h h2{font-size:17px;font-weight:700}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.sheet-body{display:flex;flex-direction:column;gap:14px}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.menu .row{padding:12px 4px}
.chev{color:var(--faint)}
.tips li{margin-bottom:8px}
.tips{padding-left:18px;margin:0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="loading">Жүктелуде…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Негізгі мәзір"></nav>
<button class="fab" id="fab" data-act="newTx" aria-label="Операция қосу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-h"><h2 id="sheet-title"></h2><button class="x" data-act="closeSheet" aria-label="Жабу"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const nf = new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 0});
const fmt = n => nf.format(Math.round(n || 0)) + " ₸";
const fmtS = n => (n > 0 ? "+" : n < 0 ? "−" : "") + nf.format(Math.abs(Math.round(n || 0))) + " ₸";
const fmtK = n => { const a = Math.abs(n); if (a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + " млн"; if (a >= 1000) return Math.round(n/1000) + " мың"; return String(Math.round(n)); };
const parseAmt = v => { const x = parseFloat(String(v ?? "").replace(/[\s ]/g, "").replace(",", ".")); return isFinite(x) ? Math.round(x * 100) / 100 : NaN; };
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const mkey = date => date.slice(0, 7);
const curMonth = () => mkey(today());
const MONTHS = ["Қаңтар","Ақпан","Наурыз","Сәуір","Мамыр","Маусым","Шілде","Тамыз","Қыркүйек","Қазан","Қараша","Желтоқсан"];
const MSHORT = ["Қаң","Ақп","Нау","Сәу","Мам","Мау","Шіл","Там","Қыр","Қаз","Қар","Жел"];
const WD = ["Жексенбі","Дүйсенбі","Сейсенбі","Сәрсенбі","Бейсенбі","Жұма","Сенбі"];
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return MONTHS[m-1] + " " + y; };
const shiftMonth = (k, d) => { let [y, m] = k.split("-").map(Number); m += d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const daysIn = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const dayLabel = ds => { const d = new Date(ds + "T00:00:00"); const t = today(); const y = dstr(new Date(Date.now() - 864e5)); if (ds === t) return "Бүгін"; if (ds === y) return "Кеше"; return `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()}, ${WD[d.getDay()].toLowerCase()}`; };
const monthsBetween = (fromDs, toDs) => { const a = new Date(fromDs + "T00:00:00"), b = new Date(toDs + "T00:00:00"); return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- defaults ---------- */
function defaults(){
  const ce = (id, name, icon, group) => ({id, name, icon, type: "exp", group});
  const ci = (id, name, icon) => ({id, name, icon, type: "inc"});
  return {
    v: 1,
    accounts: [
      {id: "card", name: "Карта", icon: "💳", initial: 0},
      {id: "cash", name: "Қолма-қол", icon: "💵", initial: 0}
    ],
    cats: [
      ce("food","Азық-түлік","🛒","need"), ce("cafe","Кафе, фастфуд","🍔","want"),
      ce("transport","Көлік","🚌","need"), ce("taxi","Такси","🚕","want"),
      ce("home","Пәтер, коммуналдық","🏠","need"), ce("phone","Байланыс, интернет","📱","need"),
      ce("health","Денсаулық","💊","need"), ce("edu","Білім","📚","need"),
      ce("clothes","Киім","👕","want"), ce("fun","Ойын-сауық","🎮","want"),
      ce("beauty","Сұлулық","💅","want"), ce("subs","Жазылымдар","📺","want"),
      ce("gifts","Сыйлықтар","🎁","want"), ce("other","Басқа","📦","want"),
      ci("salary","Жалақы","💼"), ci("stipend","Стипендия","🎓"), ci("side","Қосымша табыс","💡"),
      ci("gift_in","Сыйлық","🎁"), ci("cashback","Кэшбэк","💳"), ci("other_in","Басқа","💰")
    ],
    budgets: {},
    goals: [],
    recurring: [],
    debts: [],
    splits: [],
    rates: {},
    challenges: {},
    work: {}
  };
}
function normalize(s){
  const d = defaults();
  s = s && typeof s === "object" ? s : {};
  for (const k of ["accounts","cats","goals","recurring","debts"]) if (!Array.isArray(s[k])) s[k] = d[k];
  if (!s.budgets || typeof s.budgets !== "object") s.budgets = {};
  if (!s.rates || typeof s.rates !== "object") s.rates = {};
  if (!Array.isArray(s.splits)) s.splits = [];
  if (!s.challenges || typeof s.challenges !== "object") s.challenges = {};
  if (!s.work || typeof s.work !== "object") s.work = {};
  if (!s.cats.length) s.cats = d.cats;
  if (!s.accounts.length) s.accounts = d.accounts;
  s.v = 1;
  return s;
}

/* ---------- state ---------- */
let S = {settings: null, months: {}};
let saved = null;          // real state stashed while demo runs
let mode = "loading";      // cloud | local | demo
let cloud = null;          // {db, base}
let syncState = "idle";
let ver = 0, flatCache = null, flatVer = -1;
const ui = {tab: "home", sub: null, opsMonth: curMonth(), anMonth: curMonth(), opsType: "all", opsCat: "", opsQ: "", lastAcc: lsGet("qalta-lastacc") || ""};

function bump(){ ver++; }
function allTx(){ if (flatVer !== ver) { flatCache = Object.values(S.months).flat(); flatVer = ver; } return flatCache; }
const cat = id => S.settings.cats.find(c => c.id === id);
const acc = id => S.settings.accounts.find(a => a.id === id);
const goal = id => S.settings.goals.find(g => g.id === id);
const debt = id => S.settings.debts.find(d => d.id === id);

/* ---------- currencies ---------- */
const CURS = {KZT: ["₸", "Теңге"], USD: ["$", "АҚШ доллары"], EUR: ["€", "Еуро"], RUB: ["₽", "Рубль"], CNY: ["¥", "Юань"], GBP: ["£", "Фунт"], TRY: ["₺", "Лира"], AED: ["AED", "Дирхам"], KGS: ["сом", "Қырғыз сомы"], UZS: ["сўм", "Өзбек сумы"]};
const sym = c => (CURS[c] || [c])[0];
const nf2 = new Intl.NumberFormat("ru-RU", {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmtC = (n, c) => (!c || c === "KZT") ? fmt(n) : nf2.format(Math.round((n || 0) * 100) / 100) + " " + sym(c);
const fmtCS = (n, c) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmtC(Math.abs(n), c);
const RATE_KEY = "qalta-rates-v1";
let RATES = (() => { try { return JSON.parse(lsGet(RATE_KEY) || "null") || {kzt: {}, at: 0, src: ""}; } catch { return {kzt: {}, at: 0, src: ""}; } })();
// ₸ for 1 unit of currency c: manual rate wins, then the fetched market rate
function rate(c){
  if (!c || c === "KZT") return 1;
  const o = S.settings && S.settings.rates && +S.settings.rates[c];
  if (o > 0) return o;
  return RATES.kzt[c] || null;
}
const toKZT = (n, c) => { const r = rate(c); return r ? n * r : 0; };
const accCur = id => { const a = acc(id); return (a && a.cur) || "KZT"; };
const goalCur = g => (g && g.cur) || "KZT";
const usedCurs = () => [...new Set([...S.settings.accounts.map(a => a.cur || "KZT"), ...S.settings.goals.map(goalCur)])].filter(c => c !== "KZT");
const missingRates = () => usedCurs().filter(c => !rate(c));
async function fetchRates(force){
  if (!force && Date.now() - RATES.at < 6 * 3600e3 && Object.keys(RATES.kzt).length) return false;
  if (!navigator.onLine) return false;
  const tries = [
    async () => { const r = await fetch("https://open.er-api.com/v6/latest/KZT"); const j = await r.json(); if (j.result !== "success") throw 0; const k = {}; for (const c of Object.keys(CURS)) if (c !== "KZT" && j.rates[c]) k[c] = 1 / j.rates[c]; return {kzt: k, at: Date.now(), src: "open.er-api.com", day: (j.time_last_update_utc || "").slice(5, 16)}; },
    async () => { const r = await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/kzt.json"); const j = await r.json(); const k = {}; for (const c of Object.keys(CURS)) { const v = j.kzt && j.kzt[c.toLowerCase()]; if (c !== "KZT" && v) k[c] = 1 / v; } if (!Object.keys(k).length) throw 0; return {kzt: k, at: Date.now(), src: "currency-api", day: j.date || ""}; }
  ];
  for (const t of tries) { try { RATES = await t(); lsSet(RATE_KEY, JSON.stringify(RATES)); return true; } catch {} }
  return false;
}
// tenge value of a transaction's account-side amount (rate fixed at the moment it was written)
const txKZT = t => { const c = accCur(t.acc); return c === "KZT" ? t.a : t.a * (t.r || rate(c) || 0); };

function balances(asOf){
  const b = {};
  for (const a of S.settings.accounts) b[a.id] = +a.initial || 0;
  const add = (id, v) => { if (id && id in b) b[id] += v; };
  for (const t of allTx()) {
    if (asOf && t.date > asOf) continue;
    if (t.t === "exp") add(t.acc, -t.a);
    else if (t.t === "inc") add(t.acc, t.a);
    else if (t.t === "tr") { add(t.acc, -t.a); add(t.to, t.ta ?? t.a); }
    else if (t.t === "goal") add(t.acc, -(t.gd || 1) * t.a);
    else if (t.t === "debt") add(t.acc, (t.s || 1) * t.a);
  }
  return b;
}
const totalBalance = () => { const b = balances(); return S.settings.accounts.reduce((s, a) => s + toKZT(b[a.id], a.cur), 0); };
function goalSaved(g, asOf){ let s = +g.start || 0; for (const t of allTx()) if (t.t === "goal" && t.g === g.id && (!asOf || t.date <= asOf)) s += (t.gd || 1) * (t.ga ?? t.a); return s; }
function debtRepaid(d){ let s = 0; for (const t of allTx()) if (t.t === "debt" && t.d === d.id && t.rep) s += t.a; return s; }

function monthStats(k){
  const txs = S.months[k] || [];
  let inc = 0, exp = 0, sav = 0, need = 0, want = 0;
  const byCat = {}, byDay = {};
  for (const t of txs) {
    if (t.t === "exp") {
      const v = txKZT(t);
      exp += v; byCat[t.c] = (byCat[t.c] || 0) + v;
      const d = +t.date.slice(8, 10); byDay[d] = (byDay[d] || 0) + v;
      const c = cat(t.c); if (c && c.group === "need") need += v; else want += v;
    } else if (t.t === "inc") inc += txKZT(t);
    else if (t.t === "goal" && !t.int) sav += (t.gd || 1) * (t.acc ? txKZT(t) : toKZT(t.ga ?? t.a, goalCur(goal(t.g))));
  }
  return {inc, exp, sav, need, want, byCat, byDay, txs};
}

/* ---------- persistence ---------- */
const LS_KEY = "qalta-data-v1";
const META_KEY = "qalta-meta-v1";          // {uid, dirty:{path: version}}
const CFG = window.QALTA_CONFIG || {};
const hasCloud = () => !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
let sb = null, session = null, rtChannel = null;
let meta = {uid: null, dirty: {}};
function loadMeta(){ try { meta = Object.assign({uid: null, dirty: {}}, JSON.parse(lsGet(META_KEY) || "{}")); } catch {} }
function saveMeta(){ lsSet(META_KEY, JSON.stringify(meta)); }
function setSync(s){ syncState = s; const el = $("#sync"); if (el) el.outerHTML = syncHTML(); }
function saveLocal(){ if (mode === "demo" || mode === "auth") return; lsSet(LS_KEY, JSON.stringify({settings: S.settings, months: S.months})); }
function markDirty(path){
  if (mode === "demo") return;
  saveLocal();
  if (mode !== "cloud") return;
  meta.dirty[path] = (meta.dirty[path] || 0) + 1; saveMeta(); scheduleFlush();
}
function persistSettings(){ markDirty("settings"); }
function persistMonth(k){ markDirty("m/" + k); }
const docData = p => p === "settings" ? S.settings : {items: S.months[p.slice(2)] || []};
let flushT = null, flushing = false;
function scheduleFlush(ms){ clearTimeout(flushT); flushT = setTimeout(flush, ms ?? 400); }
async function flush(){
  if (mode !== "cloud" || !sb || !session || flushing) return;
  const paths = Object.keys(meta.dirty);
  if (!paths.length) { setSync("ok"); return; }
  if (!navigator.onLine) { setSync("offline"); return; }
  flushing = true; setSync("busy");
  const vers = {}; for (const p of paths) vers[p] = meta.dirty[p];
  const now = new Date().toISOString();
  const rows = paths.map(p => ({user_id: session.user.id, path: p, data: JSON.parse(JSON.stringify(docData(p))), updated_at: now}));
  let error = null;
  try { ({error} = await sb.from("qalta_docs").upsert(rows)); } catch (e) { error = e; }
  flushing = false;
  if (error) { setSync(navigator.onLine ? "err" : "offline"); scheduleFlush(6000); return; }
  for (const p of paths) if (meta.dirty[p] === vers[p]) delete meta.dirty[p];
  saveMeta();
  if (Object.keys(meta.dirty).length) scheduleFlush(50); else setSync("ok");
}
function applyRemote(rows){
  let changed = false;
  for (const r of rows || []) {
    if (!r || !r.path || meta.dirty[r.path]) continue;
    if (r.path === "settings") { S.settings = normalize(r.data); changed = true; }
    else if (r.path.startsWith("m/")) { S.months[r.path.slice(2)] = r.data && Array.isArray(r.data.items) ? r.data.items : []; changed = true; }
  }
  if (changed) { bump(); saveLocal(); }
  return changed;
}
async function pull(){
  if (mode !== "cloud" || !sb || !navigator.onLine) return;
  try {
    const {data, error} = await sb.from("qalta_docs").select("path,data");
    if (error) throw error;
    if (applyRemote(data)) render();
    flush();
  } catch { setSync("err"); }
}
function commitSettings(){ bump(); persistSettings(); render(); }

/* ---------- deposit interest ---------- */
// A deposit goal with g.auto gets its monthly interest (annual rate / 12, on the balance that day)
// written on g.payDay of every month. Ids are deterministic, so two devices can't credit a month twice.
let cloudReady = false;
const payDate = (k, g) => `${k}-${pad(Math.min(+g.payDay || 1, daysIn(k)))}`;
function firstIntMonth(g){ const k = curMonth(); return today() >= payDate(k, g) ? k : shiftMonth(k, -1); }
function accrueInterest(){
  if (!(mode === "local" || (mode === "cloud" && cloudReady))) return;
  const now = today(), cm = curMonth(); let touched = false;
  for (const g of S.settings.goals) {
    if (accruePremium(g)) touched = true;
    if (!g.auto || !(+g.rate > 0)) continue;
    if (!g.lastInt) { g.lastInt = firstIntMonth(g); touched = true; continue; }
    let k = shiftMonth(g.lastInt, 1);
    while (k <= cm && payDate(k, g) <= now) {
      const date = payDate(k, g), id = `int-${g.id}-${k}`;
      const bal = goalSaved(g, shiftDay(date, -1)), amt = Math.round(bal * g.rate / 1200 * 100) / 100;
      const list = S.months[k] || [];
      if (amt > 0 && !list.some(t => t.id === id)) {
        S.months[k] = list.concat([{id, t: "goal", g: g.id, gd: 1, a: amt, ga: amt, acc: "", date, n: "Депозит пайызы", int: 1, ts: Date.now()}]);
        persistMonth(k); bump();
      }
      g.lastInt = k; touched = true; k = shiftMonth(k, 1);
    }
  }
  if (touched) { bump(); persistSettings(); }
}
// net top-ups made into a goal during year y (interest and premiums excluded) + what the user says they put in before the app
function yearContrib(g, y){
  let s = g.premBase && +g.premBase.y === y ? +g.premBase.a || 0 : 0;
  for (const t of allTx()) if (t.t === "goal" && t.g === g.id && !t.int && t.date.slice(0, 4) === String(y)) s += (t.gd || 1) * (t.ga ?? t.a);
  return Math.max(0, s);
}
const premiumFor = (g, y) => Math.round(Math.min(yearContrib(g, y), +g.premCap || Infinity) * (+g.prem || 0)) / 100;
function accruePremium(g){
  if (!(+g.prem > 0)) return false;
  const y0 = new Date().getFullYear();
  if (!g.lastPrem) { g.lastPrem = y0 - 1; return true; }
  let touched = false;
  for (let y = +g.lastPrem + 1; y < y0 && `${y + 1}-01-${pad(Math.min(+g.payDay || 1, 28))}` <= today(); y++) {
    const date = `${y + 1}-01-${pad(Math.min(+g.payDay || 1, 28))}`, k = mkey(date), id = `prem-${g.id}-${y}`, amt = premiumFor(g, y), list = S.months[k] || [];

async function boot(){

async function startCloud(s){

  return `<div class="stack">

    <div class="hero-row"><div><small>Кіріс · ${MSHORT[+k.slice(5)-1]}</small><b class="num">${fmt(st.inc)}</b></div><div><small>Шығын</small><b class="num">${fmt(st.exp)}</b></div><div><small>Жинаққа</small><b class="num">${fmt(st.sav)}</b></div></div>
    <div class="hero-day">${dayLine}</div>${allTx().length ? `<div class="hero-day small" style="opacity:.92;margin-top:6px">Ай соңына болжам: <b class="num">≈ ${fmt(forecast().end)}</b></div>` : ""}${usedCurs().length ? `<div class="hero-day small" style="opacity:.85;margin-top:6px">${usedCurs().map(c => rate(c) ? `1 ${sym(c)} = ${nf2.format(Math.round(rate(c) * 100) / 100)} ₸` : `${c}: бағам жоқ`).join(" · ")}</div>` : ""}</section>
  <section class="card section"><div class="sec-h"><h2>Кірістер</h2><span class="small muted num">${fmt(st.inc)}</span></div><div class="bubs">${incB}</div></section>
  <section class="card section"><div class="sec-h"><h2>Шоттар</h2><span class="small muted num">${fmt(total)}</span></div><div class="bubs">${accB}</div></section>

  <p class="drag-hint">Шотты басып, шығын санатына сүйреңіз — шығын жазылады. Басқа шотқа сүйресеңіз — аударым, кірісті шотқа — табыс.</p>
  ${splitsHome()}
  ${notes.length ? `<section class="section"><div class="sec-h"><h2>Назар аударыңыз</h2></div>${notes.join("")}</section>` : ""}

  <section class="card section"><div class="sec-h"><h2>Мақсаттар</h2><button class="link" data-act="${S.settings.goals.length ? "tab" : "editGoal"}" data-tab="goals">${S.settings.goals.length ? "Барлығы" : "+ Қосу"}</button></div>${goalsMini ? `<div class="list">${goalsMini}</div>` : `<div class="empty"><b>Не үшін жинайсыз?</b>Телефон, демалыс, қауіпсіздік қоры — мақсат қойып, депозит сияқты толтырып отырыңыз.</div>`}</section>
  </div></div>`;
}

/* ---------- views: analysis ---------- */
const SERIES = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)"];
function donutSVG(parts, total){
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.map(p => {
    const len = total ? p.v / total * C : 0; const gap = parts.length > 1 ? Math.min(2, len / 2) : 0;
    const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${p.color}" stroke-width="24" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" data-tip="${esc(p.label + ": " + fmt(p.v) + " · " + Math.round(p.v / total * 100) + "%")}" style="pointer-events:stroke"/>`;
    off += len; return s;
  }).join("");
  return `<svg class="chart donut" viewBox="0 0 180 180" role="img" aria-label="Шығындардың санаттар бойынша бөлінуі"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="24"/><g transform="rotate(-90 90 90)">${segs}</g><text x="90" y="84" text-anchor="middle" style="font-size:11px">Шығын</text><text x="90" y="104" text-anchor="middle" class="num" style="font-size:${fmt(total).length <= 9 ? 16 : fmt(total).length <= 12 ? 14 : 12}px;font-weight:700;fill:var(--text)">${esc(fmt(total))}</text></svg>`;
}
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barPath(x, y, w, h, r){ if (h <= 0) return ""; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function dailySVG(k, byDay){
  const n = daysIn(k), W = 480, H = 200, L = 58, B = 22, T = 10, pw = W - L - 6, ph = H - B - T;
  const vals = Array.from({length: n}, (_, i) => byDay[i + 1] || 0);
  const max = niceMax(Math.max(...vals)), slot = pw / n, bw = Math.max(3, slot - 3);
  const ty = v => T + ph - v / max * ph;
  const isCur = k === curMonth(), td = new Date().getDate();
  const passed = isCur ? td : n, avg = vals.slice(0, passed).reduce((a, b) => a + b, 0) / Math.max(1, passed);
  let g = "";
  for (const f of [0, .5, 1]) { const y = ty(max * f); g += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="${f ? "var(--grid)" : "var(--axis)"}" stroke-width="1"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" class="num">${esc(fmtK(max * f))}</text>`; }
  const bars = vals.map((v, i) => { const x = L + i * slot + (slot - bw) / 2; const h = v / max * ph; const future = isCur && i + 1 > td; return `<g data-tip="${esc((i + 1) + " " + MONTHS[+k.slice(5) - 1].toLowerCase() + ": " + fmt(v))}"><rect x="${L + i * slot}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>${h > 0 ? `<path d="${barPath(x, ty(v), bw, h, 3)}" fill="${isCur && i + 1 === td ? "var(--accent)" : "var(--s1)"}" opacity="${future ? .3 : 1}"/>` : ""}</g>`; }).join("");
  const ticks = [1, 5, 10, 15, 20, 25, n].filter((v, i, a) => a.indexOf(v) === i && !(v === 25 && n - 25 < 3 && v !== n)).map(d => `<text x="${L + (d - .5) * slot}" y="${H - 6}" text-anchor="middle" class="num">${d}</text>`).join("");
  const ay = ty(avg);
  // the average is labelled in a legend above the chart so it never collides with a bar
  const avgLine = avg > 0 ? `<line x1="${L}" x2="${W - 6}" y1="${ay}" y2="${ay}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6"/>` : "";
  const legend = avg > 0 ? `<div class="legend"><span><i style="width:16px;height:0;border-radius:0;border-top:2px dashed var(--text);opacity:.6;background:none"></i>орташа <b class="num" style="color:var(--text)">${esc(fmt(avg))}</b> күніне</span></div>` : "";
  return `${legend}<svg class="chart wide" viewBox="0 0 ${W} ${H}" role="img" aria-label="Күндік шығындар">${g}${bars}${avgLine}${ticks}</svg>`;
}
function trendSVG(end){
  const keys = Array.from({length: 6}, (_, i) => shiftMonth(end, i - 5));
  const data = keys.map(k => { const s = monthStats(k); return {k, inc: s.inc, exp: s.exp}; });
  const W = 480, H = 210, L = 58, B = 26, T = 10, pw = W - L - 6, ph = H - B - T;
  const max = niceMax(Math.max(1, ...data.map(d => Math.max(d.inc, d.exp))));
  const ty = v => T + ph - v / max * ph, slot = pw / 6, bw = Math.min(26, slot / 2 - 6);
  let g = "";
  for (const f of [0, .5, 1]) { const y = ty(max * f); g += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="${f ? "var(--grid)" : "var(--axis)"}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" class="num">${esc(fmtK(max * f))}</text>`; }
  const bars = data.map((d, i) => { const cx = L + i * slot + slot / 2; const m = +d.k.slice(5) - 1;
    return `<g data-tip="${esc(MONTHS[m] + ": кіріс " + fmt(d.inc) + ", шығын " + fmt(d.exp))}"><rect x="${L + i * slot}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/><path d="${barPath(cx - bw - 1, ty(d.inc), bw, d.inc / max * ph, 4)}" fill="var(--inc)"/><path d="${barPath(cx + 1, ty(d.exp), bw, d.exp / max * ph, 4)}" fill="var(--exp)"/><text x="${cx}" y="${H - 6}" text-anchor="middle" style="${d.k === end ? "fill:var(--text);font-weight:700" : ""}">${MSHORT[m]}</text></g>`; }).join("");
  return `<div class="legend"><span><i style="background:var(--inc)"></i>Кіріс</span><span><i style="background:var(--exp)"></i>Шығын</span></div><svg class="chart wide" viewBox="0 0 ${W} ${H}" role="img" aria-label="Соңғы 6 айдағы кіріс пен шығын">${g}${bars}</svg>`;
}
function avgMonthlyExp(n){ let s = 0, c = 0; for (let i = 1; i <= n; i++) { const e = monthStats(shiftMonth(curMonth(), -i)).exp; if (e > 0) { s += e; c++; } } if (!c) { const e = monthStats(curMonth()).exp; return e; } return s / c; }
const anSeg = () => `<div class="seg" style="max-width:420px">${[["month","Ай талдауы"],["overall","Жалпы жағдай"]].map(([v, l]) => `<button data-act="anView" data-v="${v}" aria-pressed="${(ui.anView || "month") === v}">${l}</button>`).join("")}</div>`;
function vAnalysis(){

  const dExp = prev.exp > 0 ? (st.exp - prev.exp) / prev.exp * 100 : null;

  const cats = Object.entries(st.byCat).map(([id, v]) => ({id, v, c: cat(id)})).sort((a, b) => b.v - a.v);
  const top = cats.slice(0, 7), rest = cats.slice(7).reduce((s, x) => s + x.v, 0);
  const parts = top.map((x, i) => ({label: x.c ? x.c.name : "Басқа", v: x.v, color: SERIES[i]}));

  const catRows = cats.map((x, i) => { const pv = prev.byCat[x.id] || 0; const d = pv ? Math.round((x.v - pv) / pv * 100) : null; const lim = S.settings.budgets[x.id];
    return `<div class="catrow"><span class="sw" style="background:${i < 7 ? SERIES[i] : "var(--s-other)"}"></span><span class="nm">${esc(x.c ? x.c.icon + " " + x.c.name : "Басқа")}<span class="small muted" style="display:block">${Math.round(x.v / st.exp * 100)}%${lim ? ` · лимит ${fmt(lim)}` : ""}</span></span><span class="v num">${fmt(x.v)}<small>${d === null ? "жаңа" : (d > 0 ? "▲ +" : d < 0 ? "▼ " : "") + d + "%"}</small></span></div>`; }).join("");
  const donut = cats.length ? `<div class="donut-wrap">${donutSVG(parts, st.exp)}<div>${catRows}</div></div>` : `<div class="empty">Бұл айда шығын жазылмаған.</div>`;

    const w = v => Math.max(0, Math.min(100, v));

function noSpend(){
  const k = curMonth(), day = new Date().getDate(), st = monthStats(k), spent = {};
  for (const t of st.txs) if (t.t === "exp" && !isRecTx(t)) spent[+t.date.slice(8)] = 1;
  let first = null; for (const t of allTx()) if (!first || t.date < first) first = t.date;
  const from = !first ? day + 1 : first < k + "-01" ? 1 : first.slice(0, 7) === k ? +first.slice(8) : day + 1;
  let count = 0, best = 0, run = 0;
  for (let d = from; d <= day; d++) { if (!spent[d]) { count++; run++; best = Math.max(best, run); } else run = 0; }
  let cur = 0; for (let d = spent[day] ? day - 1 : day; d >= from && !spent[d]; d--) cur++;
  return {day, dim: daysIn(k), from, spent, count, best, cur, target: +S.settings.challenges.nospend || 8};
}

function goalCalc(g){
  const s = goalSaved(g), rest = g.target ? Math.max(0, g.target - s) : 0, p = g.target ? Math.min(100, s / g.target * 100) : 0;
  const i = (+g.rate || 0) / 1200;
  let perMonth = null, months = null;
  if (g.deadline && g.target) {
    months = Math.max(1, monthsBetween(today(), g.deadline) + 1);
    if (rest <= 0) perMonth = 0;
    else if (i > 0) { const f = Math.pow(1 + i, months); perMonth = Math.max(0, (g.target - s * f) * i / (f - 1)); }
    else perMonth = rest / months;
  }
  const yearly = i > 0 ? s * (Math.pow(1 + i, 12) - 1) : 0;
  // pace: average contribution over last 3 months
  let contrib = 0; const since = shiftMonth(curMonth(), -2);
  for (const t of allTx()) if (t.t === "goal" && t.g === g.id && !t.int && mkey(t.date) >= since) contrib += (t.gd || 1) * (t.ga ?? t.a);
  const pace = contrib / 3;
  return {s, rest, p, perMonth, months, yearly, pace};
}

  </div>`;

/* ---------- sheet ---------- */
let sheetClose = null;
function openSheet(title, html, mount){
  $("#sheet-title").textContent = title;
  $("#sheet-body").innerHTML = html;
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
  if (mount) mount($("#sheet-body"));
}
function closeSheet(){ $("#sheet").hidden = true; document.body.style.overflow = ""; $("#sheet-body").innerHTML = ""; }
function armDelete(btn, fn, label){
  if (btn.classList.contains("armed")) { fn(); return; }
  btn.classList.add("armed"); const t = btn.textContent; btn.textContent = label || "Иә, өшіру";
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = t; } }, 3500);
}
function toast(msg){
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.setAttribute("role", "status"); el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)"; document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 2800);
}
const accOptions = (sel, allowNone, noneLabel) => (allowNone ? `<option value="">${noneLabel || "Шотсыз"}</option>` : "") + S.settings.accounts.map(a => `<option value="${esc(a.id)}" ${a.id === sel ? "selected" : ""}>${esc(a.icon + " " + a.name + (a.cur && a.cur !== "KZT" ? " (" + sym(a.cur) + ")" : ""))}</option>`).join("");
const curOptions = sel => Object.keys(CURS).map(c => `<option value="${c}" ${c === (sel || "KZT") ? "selected" : ""}>${esc(sym(c) + " " + CURS[c][1])}</option>`).join("");
const convert = (n, from, to) => { const a = rate(from), b = rate(to); return a && b ? n * a / b : null; };
const defAcc = () => (acc(ui.lastAcc) ? ui.lastAcc : (S.settings.accounts[0] || {}).id || "");

/* transaction editor */
function openTx(existing, type, preset){
  const t = existing ? {...existing} : {id: uid(), t: type || "exp", a: "", c: null, acc: defAcc(), to: "", date: today(), n: "", ...(preset || {})};
  const prevKey = existing ? mkey(existing.date) : null;
  if (existing && (t.t === "goal" || t.t === "debt")) {
    openSheet(txTitle(t), `<div class="note"><span class="ico">${esc(txIcon(t))}</span><div class="mid"><b class="num">${t.acc ? fmtC(t.a, accCur(t.acc)) : fmtC(t.ga ?? t.a, goalCur(goal(t.g)))}</b><div class="small muted">${esc(t.date)}${t.n ? " · " + esc(t.n) : ""}</div></div></div><p class="small muted" style="margin:0">Бұл операция ${t.t === "goal" ? "мақсатпен" : "қарызбен"} байланысты. Өшірсеңіз, ${t.t === "goal" ? "мақсаттағы сома" : "қарыз қалдығы"} мен шот қалдығы қайта есептеледі.</p><button class="btn danger block" id="tx-del">Операцияны өшіру</button>`, b => {
      $("#tx-del", b).onclick = e => armDelete(e.currentTarget, () => { removeTx(existing); closeSheet(); toast("Өшірілді"); });
    });
    return;
  }
  let taTouched = existing && existing.ta != null;
  const draw = () => {
    const cats = S.settings.cats.filter(c => c.type === (t.t === "inc" ? "inc" : "exp"));
    if (t.t === "tr" && (!t.to || t.to === t.acc)) t.to = (S.settings.accounts.find(a => a.id !== t.acc) || {}).id || "";
    const c1 = accCur(t.acc), c2 = accCur(t.to), cross = t.t === "tr" && c1 !== c2;
    if (cross && !taTouched) { const v = convert(parseAmt(t.a), c1, c2); t.ta = v && isFinite(v) ? Math.round(v * 100) / 100 : ""; }
    const body = `
      <div class="seg" role="group" aria-label="Түрі">${[["exp","Шығын"],["inc","Кіріс"],["tr","Аударым"]].map(([v, l]) => `<button data-ttype="${v}" aria-pressed="${t.t === v}">${l}</button>`).join("")}</div>
      <div class="field"><label for="tx-amt">${cross ? "Шоттан кетеді" : "Сома"}, ${esc(sym(c1))}</label><input class="inp big num" id="tx-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${t.a === "" ? "" : esc(t.a)}">${!cross && c1 !== "KZT" && t.t !== "tr" ? `<span class="small muted" id="tx-kzt"></span>` : ""}${t.t === "exp" && hoursOf(1) ? `<span class="small muted" id="tx-hrs"></span>` : ""}</div>
      ${t.t === "tr" ? `<div class="frow"><div class="field"><label for="tx-acc">Қайдан</label><select class="inp" id="tx-acc">${accOptions(t.acc)}</select></div><div class="field"><label for="tx-to">Қайда</label><select class="inp" id="tx-to">${accOptions(t.to)}</select></div></div>
         ${cross ? `<div class="field"><label for="tx-ta">Шотқа түседі, ${esc(sym(c2))}</label><input class="inp big num" id="tx-ta" inputmode="decimal" placeholder="0" value="${t.ta === "" || t.ta == null ? "" : esc(t.ta)}"><span class="small muted" id="tx-rate">Банктің нақты сомасын жазыңыз — бағам өзі есептеледі.</span></div>` : ""}`
      : `<div class="field"><span class="flabel">Санат</span><div class="catgrid">${cats.map(c => `<button class="cat" data-cat="${esc(c.id)}" aria-pressed="${t.c === c.id}"><span>${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`).join("")}</div></div>
         <div class="field"><label for="tx-acc">Шот</label><select class="inp" id="tx-acc">${accOptions(t.acc)}</select></div>`}
      <div class="frow"><div class="field"><label for="tx-date">Күні</label><input class="inp" type="date" id="tx-date" value="${esc(t.date)}" max="${shiftMonth(curMonth(), 12)}-28"></div><div class="field"><label for="tx-note">Ескертпе</label><input class="inp" id="tx-note" placeholder="Міндетті емес" value="${esc(t.n || "")}"></div></div>
      <div class="err" id="tx-err"></div>
      <button class="btn primary block" id="tx-save">${existing ? "Сақтау" : "Қосу"}</button>
      ${!existing && t.t === "exp" ? `<button class="btn ghost block" id="tx-split">👥 Бірнеше адамға бөлу (счет бөлу)</button>` : ""}
      ${existing ? `<button class="btn danger block" id="tx-del">Өшіру</button>` : ""}`;
    openSheet(existing ? "Операцияны өзгерту" : "Жаңа операция", body, b => {
      const read = () => { t.a = $("#tx-amt", b).value; t.acc = $("#tx-acc", b).value; t.date = $("#tx-date", b).value || today(); t.n = $("#tx-note", b).value.trim(); const to = $("#tx-to", b); if (to) t.to = to.value; const ta = $("#tx-ta", b); if (ta) t.ta = ta.value; };
      const hint = () => {
        const a = parseAmt($("#tx-amt", b).value), kz = $("#tx-kzt", b), rt = $("#tx-rate", b), ta = $("#tx-ta", b);
        if (kz) kz.textContent = a > 0 && rate(c1) ? "≈ " + fmt(a * rate(c1)) + " (1 " + sym(c1) + " = " + nf2.format(Math.round(rate(c1) * 100) / 100) + " ₸)" : rate(c1) ? "" : "Бағам жүктелмеді — «Тағы → Валюта бағамы»";
        if (ta && rt) { const x = parseAmt(ta.value); if (a > 0 && x > 0) { const big = c1 === "KZT" ? a / x : c2 === "KZT" ? x / a : a / x; const lbl = c1 === "KZT" ? `1 ${sym(c2)} = ${nf2.format(Math.round(big * 100) / 100)} ₸` : c2 === "KZT" ? `1 ${sym(c1)} = ${nf2.format(Math.round(big * 100) / 100)} ₸` : `1 ${sym(c2)} = ${nf2.format(Math.round(big * 10000) / 10000)} ${sym(c1)}`; rt.textContent = "Бағам: " + lbl; } }
      };
      hint();
      const hrsUpd = () => { const hr = $("#tx-hrs", b); if (!hr) return; const v = parseAmt($("#tx-amt", b).value); const kzt = v > 0 ? (c1 === "KZT" ? v : v * (rate(c1) || 0)) : 0; hr.textContent = kzt > 0 ? "⏱ Бұл ≈ " + fmtHours(hoursOf(kzt)) + " жұмысыңыз" : ""; };
      hrsUpd(); $("#tx-amt", b).addEventListener("input", hrsUpd);
      $("#tx-amt", b).addEventListener("input", () => { const ta = $("#tx-ta", b); if (ta && !taTouched) { const v = convert(parseAmt($("#tx-amt", b).value), c1, c2); ta.value = v && isFinite(v) ? Math.round(v * 100) / 100 : ""; } hint(); });
      const taEl = $("#tx-ta", b); if (taEl) taEl.addEventListener("input", () => { taTouched = true; hint(); });
      ["#tx-acc", "#tx-to"].forEach(sel => { const el = $(sel, b); if (el) el.addEventListener("change", () => { read(); taTouched = false; draw(); }); });
      $$("[data-ttype]", b).forEach(x => x.onclick = () => { read(); const nt = x.dataset.ttype; if (nt !== t.t) { if ((nt === "inc") !== (t.t === "inc")) t.c = null; t.t = nt; draw(); } });
      $$("[data-cat]", b).forEach(x => x.onclick = () => { t.c = x.dataset.cat; $$("[data-cat]", b).forEach(y => y.setAttribute("aria-pressed", y === x)); });
      if (!existing) setTimeout(() => { const i = $("#tx-amt", b); if (i && window.matchMedia("(pointer:fine)").matches) i.focus(); }, 60);
      $("#tx-amt", b).addEventListener("keydown", e => { if (e.key === "Enter") $("#tx-save", b).click(); });
      $("#tx-save", b).onclick = () => {
        read(); const a = parseAmt(t.a), err = $("#tx-err", b);
        if (!(a > 0)) { err.textContent = "Соманы енгізіңіз (0-ден үлкен)."; return; }
        if (t.t !== "tr" && !t.c) { err.textContent = "Санатты таңдаңыз."; return; }
        if (!t.acc) { err.textContent = "Алдымен шот қосыңыз (Тағы → Шоттар)."; return; }
        if (t.t === "tr" && t.to === t.acc) { err.textContent = "Бір шоттан сол шотқа аударуға болмайды."; return; }
        const rec = {id: t.id, t: t.t, a, acc: t.acc, date: t.date, n: t.n, ts: t.ts};
        if (t.t === "tr") {
          rec.to = t.to;
          if (accCur(t.acc) !== accCur(t.to)) { const ta = parseAmt(t.ta); if (!(ta > 0)) { err.textContent = "Шотқа қанша түскенін жазыңыз."; return; } rec.ta = ta; }
        } else {
          rec.c = t.c;
          const cur = accCur(t.acc);
          if (cur !== "KZT") { const keep = existing && existing.r && existing.acc === t.acc && existing.date === t.date; rec.r = keep ? existing.r : rate(cur) || undefined; if (!rec.r) delete rec.r; }
        }
        ui.lastAcc = t.acc; lsSet("qalta-lastacc", t.acc);

      };
      const del = $("#tx-del", b); if (del) del.onclick = e => armDelete(e.currentTarget, () => { removeTx(existing); closeSheet(); toast("Өшірілді"); });
      const sp = $("#tx-split", b); if (sp) sp.onclick = () => { read(); openSplit({total: parseAmt(t.a) > 0 ? parseAmt(t.a) : "", c: t.c, acc: t.acc, title: t.n}); };
    });
  };
  draw();
}

/* ---------- split bills ---------- */
const splitById = id => S.settings.splits.find(x => x.id === id);
function splitInfo(sp){
  const ds = sp.people.map(p => p.d && debt(p.d)).filter(Boolean);
  const paid = ds.filter(d => d.closed).length;
  const back = ds.reduce((s, d) => s + debtRepaid(d), 0), owed = ds.reduce((s, d) => s + d.amount, 0);
  return {ds, paid, count: ds.length, back, owed, done: ds.length > 0 && paid === ds.length};
}
function splitRow(sp){
  const i = splitInfo(sp);
  const pct = i.owed ? i.back / i.owed * 100 : 100;
  return `<button class="row" data-act="viewSplit" data-id="${esc(sp.id)}"><span class="ico">👥</span><span class="mid"><span class="t" style="display:block">${esc(sp.title)}</span><span class="s" style="display:block">${esc(dayLabel(sp.date))} · ${sp.payer === "me" ? `${i.paid}/${i.count} қайтарды` : `${esc(sp.payerName)} төледі`}</span><span class="bar" style="display:block;margin-top:6px"><i class="ok" style="width:${pct}%"></i></span></span><span class="amt num">${fmt(sp.total)}${i.done ? `<span class="s" style="display:block;font-weight:400;color:var(--pos)">✓ жабылды</span>` : `<span class="s" style="display:block;font-weight:400">${sp.payer === "me" ? "күтілуде " + fmt(i.owed - i.back) : "қайтару " + fmt(i.owed - i.back)}</span>`}</span></button>`;
}
function splitsHome(){
  const open = S.settings.splits.filter(sp => !splitInfo(sp).done).sort((a, b) => b.date.localeCompare(a.date));
  if (!open.length) return "";
  return `<section class="card section"><div class="sec-h"><h2>Бөлінген счеттар</h2><button class="link" data-act="goSub" data-sub="splits">Барлығы</button></div><div class="list">${open.slice(0, 3).map(splitRow).join("")}</div></section>`;
}
function vSplits(){
  const all = S.settings.splits.slice().sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="stack">${backBar("Счет бөлу")}<p class="small muted" style="margin:0">Кафе, ресторан, такси — жалпы соманы бөліп, кім қайтарғанын белгілеп отырыңыз. Қайтарған адамға ✓ қойсаңыз, ақша шотыңызға түседі.</p><section class="card list">${all.map(splitRow).join("") || `<div class="empty">Әзірге бөлінген счет жоқ.</div>`}</section><button class="btn primary" data-act="newSplit">${I.plus} Жаңа счет</button></div>`;
}
function openSplit(pre){
  pre = pre || {};
  const expCats = S.settings.cats.filter(c => c.type === "exp");
  const st = {title: pre.title || "", total: pre.total || "", c: pre.c || (cat("cafe") ? "cafe" : (expCats[0] || {}).id), acc: pre.acc || defAcc(), payer: "me", payerIdx: 0, mode: "eq", people: [{name: "", share: ""}, {name: "", share: ""}]};
  const calc = () => {
    const total = parseAmt(st.total) || 0, n = st.people.length + 1;
    if (st.mode === "eq") { const base = Math.floor(total / n); st.people.forEach(p => p.share = base); return {total, me: total - base * (n - 1)}; }
    const others = st.people.reduce((s, p) => s + (parseAmt(p.share) || 0), 0);
    return {total, me: Math.round((total - others) * 100) / 100};
  };
  const draw = () => {
    const r = calc();
    openSheet("Счет бөлу", `
      <div class="field"><label for="sp-title">Қайда</label><input class="inp" id="sp-title" placeholder="Мысалы: Del Papa, туған күн" value="${esc(st.title)}"></div>
      <div class="field"><label for="sp-total">Жалпы сома, ₸</label><input class="inp big num" id="sp-total" inputmode="decimal" placeholder="0" value="${esc(st.total)}"></div>
      <div class="seg">${[["me","Мен төледім"],["other","Басқа біреу төледі"]].map(([v, l]) => `<button data-spp="${v}" aria-pressed="${st.payer === v}">${l}</button>`).join("")}</div>
      <div class="seg">${[["eq","Тең бөлу"],["custom","Әркімге өз сомасы"]].map(([v, l]) => `<button data-spm="${v}" aria-pressed="${st.mode === v}">${l}</button>`).join("")}</div>
      <div class="field"><span class="flabel">Адамдар (${st.people.length + 1})</span>
        <div class="stack" style="gap:8px">
          <div class="person me"><span class="me-l">Мен</span><span class="inp num" id="sp-me" style="background:transparent;text-align:right;font-weight:700">${fmt(r.me)}</span><span></span></div>
          ${st.people.map((p, i) => `<div class="person"><input class="inp" id="sp-n${i}" data-pi="${i}" placeholder="Аты ${i + 1}" value="${esc(p.name)}"><input class="inp num" id="sp-s${i}" data-ps="${i}" inputmode="decimal" style="text-align:right" value="${st.mode === "eq" ? (p.share || "") : esc(p.share)}" ${st.mode === "eq" ? "readonly" : ""} placeholder="0"><button class="x" data-prm="${i}" aria-label="Өшіру" ${st.people.length < 2 ? "disabled" : ""}>×</button></div>`).join("")}
          <button class="btn ghost sm" id="sp-add" style="align-self:flex-start">${I.plus} Адам қосу</button>
        </div></div>
      ${st.payer === "other" ? `<div class="field"><label for="sp-payer">Кім төледі</label><select class="inp" id="sp-payer">${st.people.map((p, i) => `<option value="${i}" ${i === st.payerIdx ? "selected" : ""}>${esc(p.name || "Аты " + (i + 1))}</option>`).join("")}</select><span class="small muted">Сіз оған өз үлесіңізді қайтарасыз — қарыз ретінде жазылады.</span></div>` : ""}
      <div class="frow"><div class="field"><label for="sp-cat">Санат</label><select class="inp" id="sp-cat">${expCats.map(c => `<option value="${esc(c.id)}" ${c.id === st.c ? "selected" : ""}>${esc(c.icon + " " + c.name)}</option>`).join("")}</select></div>
      ${st.payer === "me" ? `<div class="field"><label for="sp-acc">Қай шоттан төледіңіз</label><select class="inp" id="sp-acc">${accOptions(st.acc)}</select></div>` : `<div></div>`}</div>
      <div class="note small" id="sp-sum" style="display:block"></div>
      <div class="err" id="sp-err"></div>
      <button class="btn primary block" id="sp-save">Сақтау</button>`, b => {
      const read = () => {
        st.title = $("#sp-title", b).value; st.total = $("#sp-total", b).value; st.c = $("#sp-cat", b).value;
        const a = $("#sp-acc", b); if (a) st.acc = a.value; const py = $("#sp-payer", b); if (py) st.payerIdx = +py.value;
        st.people.forEach((p, i) => { p.name = $("#sp-n" + i, b).value; if (st.mode === "custom") p.share = $("#sp-s" + i, b).value; });
      };
      const refresh = () => {
        read(); const r = calc();
        if (st.mode === "eq") st.people.forEach((p, i) => { $("#sp-s" + i, b).value = p.share || ""; });
        $("#sp-me", b).textContent = fmt(r.me);
        const others = r.total - r.me;
        $("#sp-sum", b).innerHTML = st.payer === "me" ? `Сіздің үлесіңіз <b class="num">${fmt(r.me)}</b> шығын болып жазылады. Басқалар сізге <b class="num">${fmt(others)}</b> қайтаруы керек.` : `Сіздің үлесіңіз <b class="num">${fmt(r.me)}</b> — оны төлеген адамға қайтарасыз.`;
      };
      refresh();
      b.addEventListener("input", e => { if (e.target.matches("#sp-total, [data-ps], [data-pi], #sp-title")) refresh(); });
      $$("[data-spp]", b).forEach(x => x.onclick = () => { read(); st.payer = x.dataset.spp; draw(); });
      $$("[data-spm]", b).forEach(x => x.onclick = () => { read(); st.mode = x.dataset.spm; if (st.mode === "custom") { const r = calc(); } draw(); });
      $$("[data-prm]", b).forEach(x => x.onclick = () => { read(); st.people.splice(+x.dataset.prm, 1); if (st.payerIdx >= st.people.length) st.payerIdx = 0; draw(); });
      $("#sp-add", b).onclick = () => { read(); st.people.push({name: "", share: ""}); draw(); setTimeout(() => { const i = $("#sp-n" + (st.people.length - 1)); if (i) i.focus(); }, 50); };
      $("#sp-save", b).onclick = () => {
        read(); const r = calc(), err = $("#sp-err", b);
        if (!(r.total > 0)) { err.textContent = "Жалпы соманы жазыңыз."; return; }
        if (r.me < 0) { err.textContent = "Адамдардың сомасы жалпы сомадан асып кетті."; return; }
        if (st.mode === "custom" && st.people.some(p => !(parseAmt(p.share) > 0))) { err.textContent = "Әр адамның сомасын жазыңыз."; return; }
        if (st.payer === "me" && !st.acc) { err.textContent = "Шотты таңдаңыз."; return; }
        const id = uid(), date = today(), title = st.title.trim() || (cat(st.c) || {}).name || "Счет";
        const people = st.people.map((p, i) => ({name: p.name.trim() || "Аты " + (i + 1), share: st.mode === "eq" ? p.share : parseAmt(p.share)}));
        const sp = {id, title, date, total: r.total, c: st.c, me: r.me, mode: st.mode, payer: st.payer, acc: st.payer === "me" ? st.acc : "", people};
        const k = mkey(date); S.months[k] = S.months[k] || [];
        const push = t => { t.ts = Date.now(); S.months[k].push(t); };
        if (st.payer === "me") {
          if (r.me > 0) push({id: uid(), t: "exp", a: r.me, c: st.c, acc: st.acc, date, n: title, split: id});
          for (const p of people) {
            const d = {id: uid(), person: p.name, amount: p.share, dir: "lent", date, due: "", note: title, closed: false, split: id};
            S.settings.debts.push(d); p.d = d.id;
            push({id: uid(), t: "debt", d: d.id, s: -1, a: p.share, acc: st.acc, date, n: title, split: id});
          }
        } else {
          const payer = people[st.payerIdx] || people[0]; sp.payerName = payer.name;
          if (r.me > 0) {
            push({id: uid(), t: "exp", a: r.me, c: st.c, acc: "", date, n: `${title} (${payer.name} төледі)`, split: id});
            const d = {id: uid(), person: payer.name, amount: r.me, dir: "borrowed", date, due: "", note: title, closed: false, split: id};
            S.settings.debts.push(d); payer.d = d.id;
            push({id: uid(), t: "debt", d: d.id, s: 1, a: r.me, acc: "", date, n: title, split: id});
          }
        }
        S.settings.splits.push(sp);
        ui.lastAcc = st.acc || ui.lastAcc;
        persistSettings(); persistMonth(k); bump(); render();
        openSplitView(id); toast("Счет бөлінді");
      };
    });
  };
  draw();
}
function shareText(sp, p){
  const phone = (S.settings.kaspiPhone || "").trim();
  return `${sp.title}, ${dayLabel(sp.date).toLowerCase()}: жалпы ${fmt(sp.total)}, сенің үлесің ${fmt(p.share)}.${phone ? ` Kaspi: ${phone}` : ""}`;
}
async function shareOrCopy(text){
  try { if (navigator.share) { await navigator.share({text}); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Хабар көшірілді — WhatsApp не Telegram-ға қойыңыз"); } catch { toast(text); }
}
function openSplitView(id){
  const sp = splitById(id); if (!sp) { closeSheet(); return; }
  const i = splitInfo(sp);
  const box = on => `<span class="box">${on ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>` : ""}</span>`;
  const rows = sp.payer === "me"
    ? sp.people.map((p, idx) => { const d = p.d && debt(p.d); if (!d) return ""; return `<div style="display:flex;align-items:center;gap:6px"><button class="chk" role="checkbox" aria-checked="${d.closed}" data-spchk="${esc(d.id)}">${box(d.closed)}<span class="nm">${esc(p.name)}</span><span class="num" style="font-weight:700">${fmt(p.share)}</span></button>${d.closed ? "" : `<button class="x" data-spshare="${idx}" aria-label="${esc(p.name)} үшін хабар жіберу" title="Хабар жіберу">📤</button>`}</div>`; }).join("")
    : sp.people.filter(p => p.d && debt(p.d)).map(p => { const d = debt(p.d); return `<button class="chk" role="checkbox" aria-checked="${d.closed}" data-spchk="${esc(d.id)}">${box(d.closed)}<span class="nm">${esc(p.name)}-ге қайтардым</span><span class="num" style="font-weight:700">${fmt(d.amount)}</span></button>`; }).join("");
  openSheet(sp.title, `
    <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><small>Жалпы</small><b class="num">${fmt(sp.total)}</b><em>${esc(dayLabel(sp.date))}</em></div><div class="kpi"><small>Сіздің үлесіңіз</small><b class="num">${fmt(sp.me)}</b><em>${sp.payer === "me" ? `${i.paid}/${i.count} қайтарды` : esc(sp.payerName) + " төледі"}</em></div></div>
    ${sp.payer === "me" ? `<div class="bar thick"><i class="ok" style="width:${i.owed ? i.back / i.owed * 100 : 100}%"></i></div><div class="small muted num">Қайтарылды ${fmt(i.back)} / ${fmt(i.owed)}</div>` : ""}
    <div class="card" style="padding:4px 10px;box-shadow:none;border:1px solid var(--line)">${rows || `<div class="empty small">Қайтаратын ешкім жоқ.</div>`}</div>
    <span class="small muted">${sp.payer === "me" ? "Адам ақшаны жібергенде ✓ басыңыз — сома шотыңызға түседі. 📤 — оған үлесін хабарлама етіп жіберу." : "Қайтарғанда ✓ басыңыз — сома шотыңыздан шегеріледі."}</span>
    ${sp.payer === "me" ? `<div class="field"><label for="sp-phone">Kaspi нөміріңіз (хабарламаға қосылады)</label><input class="inp" id="sp-phone" type="tel" inputmode="tel" placeholder="+7 7__ ___ __ __" value="${esc(S.settings.kaspiPhone || "")}"></div>` : ""}
    <button class="btn danger block" id="sp-del">Счетты өшіру</button>`, b => {
    $$("[data-spchk]", b).forEach(x => x.onclick = () => toggleSplitDebt(sp, x.dataset.spchk));
    $$("[data-spshare]", b).forEach(x => x.onclick = () => shareOrCopy(shareText(sp, sp.people[+x.dataset.spshare])));
    const ph = $("#sp-phone", b); if (ph) ph.addEventListener("change", () => { S.settings.kaspiPhone = ph.value.trim(); persistSettings(); });
    $("#sp-del", b).onclick = e => armDelete(e.currentTarget, () => {
      const ids = new Set(sp.people.map(p => p.d).filter(Boolean));
      removeTxWhere(t => t.split === sp.id || (t.t === "debt" && ids.has(t.d)));
      S.settings.debts = S.settings.debts.filter(d => !ids.has(d.id));
      S.settings.splits = S.settings.splits.filter(x => x.id !== sp.id);
      commitSettings(); closeSheet(); toast("Счет өшірілді");
    });
  });
}
function toggleSplitDebt(sp, dId){
  const d = debt(dId); if (!d) return;
  if (!d.closed) {
    const left = d.amount - debtRepaid(d);
    if (left > 0) upsertTx({id: uid(), t: "debt", d: d.id, rep: true, s: d.dir === "lent" ? 1 : -1, a: left, acc: sp.acc || defAcc(), date: today(), n: sp.title});
    d.closed = true;
  } else {
    removeTxWhere(t => t.t === "debt" && t.d === d.id && t.rep);
    d.closed = false;
  }
  persistSettings(); bump(); render(); openSplitView(sp.id);
  const i = splitInfo(sp); if (i.done && sp.payer === "me") toast("Барлығы қайтарды! 🎉");
}

/* ---------- drag & drop (Budget OK style) ---------- */
let drag = null, suppressClick = false;
function dropTargets(kind){ return kind === "inc" ? ".bub.acc[data-kind]" : kind === "acc" ? ".bub.acc[data-kind], .bub.exp" : null; }
document.addEventListener("pointerdown", e => {
  const b = e.target.closest && e.target.closest(".bub[data-drag]");
  if (!b || (e.button && e.button !== 0)) return;
  if (e.pointerType === "mouse") e.preventDefault();
  drag = {el: b, kind: b.dataset.kind, id: b.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, started: false, target: null};
});
document.addEventListener("dragstart", e => { if (e.target.closest && e.target.closest(".bub")) e.preventDefault(); });
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.started = true;
    const g = document.createElement("div"); g.className = "drag-ghost"; g.textContent = drag.el.querySelector(".bub-c").textContent; document.body.appendChild(g); drag.ghost = g;
    drag.el.classList.add("dragging"); document.body.classList.add("dragging");
    $$(dropTargets(drag.kind)).forEach(t => { if (t !== drag.el) t.classList.add("target"); });
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const t = over && over.closest(".bub.target");
  if (t !== drag.target) { if (drag.target) drag.target.classList.remove("drop-ok"); drag.target = t; if (t) t.classList.add("drop-ok"); }
  // auto-scroll near the edges on phones
  const edge = 70; if (e.clientY > innerHeight - edge) window.scrollBy(0, 12); else if (e.clientY < edge) window.scrollBy(0, -12);
}, {passive: false});
function endDrag(apply){
  const d = drag; drag = null; if (!d || !d.started) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  d.ghost.remove(); d.el.classList.remove("dragging"); document.body.classList.remove("dragging");
  $$(".bub.target").forEach(t => t.classList.remove("target", "drop-ok"));
  if (!apply || !d.target) return;
  const to = d.target.dataset.id, tk = d.target.dataset.kind;
  if (d.kind === "inc" && tk === "acc") openTx(null, "inc", {c: d.id, acc: to});
  else if (d.kind === "acc" && tk === "acc") openTx(null, "tr", {acc: d.id, to});
  else if (d.kind === "acc" && tk === "exp") openTx(null, "exp", {acc: d.id, c: to});
}
document.addEventListener("pointerup", e => { if (drag && e.pointerId === drag.pid) endDrag(true); });
document.addEventListener("pointercancel", () => endDrag(false));
document.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(".bub")) e.preventDefault(); });

/* account editor */

    <div class="field"><label for="a-cur">Валюта</label><select class="inp" id="a-cur">${curOptions(a ? a.cur : "KZT")}</select>${a && allTx().some(t => t.acc === a.id || t.to === a.id) ? `<span class="small muted">Валютаны өзгертсеңіз, бұрынғы операциялардың сомасы жаңа валютада саналады.</span>` : `<span class="small muted">Мысалы, долларлық депозит үшін $ таңдаңыз — теңгеге бүгінгі бағаммен есептеледі.</span>`}</div>
    <div class="field"><label for="a-init">Бастапқы қалдық</label><input class="inp num" id="a-init" inputmode="decimal" value="${a ? esc(a.initial) : ""}" placeholder="0"><span class="small muted">Қосымшаны бастаған кездегі шоттағы сома. Қазіргі қалдық = бастапқы + кіріс − шығын.</span></div>
    ${a ? `<div class="field"><label for="a-now">Немесе қазіргі нақты қалдықты енгізіңіз</label><input class="inp num" id="a-now" inputmode="decimal" placeholder="${esc(Math.round(balances()[a.id]))}"><span class="small muted">Банк қосымшасындағы сомамен теңестіру үшін.</span></div>` : ""}

// Moves an account out of spendable money into a deposit goal, keeping its history:
// transfers in/out become deposit top-ups/withdrawals; other operations stay, without the account.
function accountToDeposit(a, r, pd){
  const bal = balances()[a.id] || 0, g = {id: uid(), created: today(), name: a.name, icon: a.icon || "🏦", target: 0, deadline: "", rate: r, cur: a.cur || "KZT", auto: 1, payDay: pd};
  g.lastInt = firstIntMonth(g);
  let moved = 0;
  for (const k of Object.keys(S.months)) {
    let ch = false;
    S.months[k] = S.months[k].map(t => {
      if (t.t === "tr" && t.to === a.id && t.acc !== a.id) { ch = true; const ga = t.ta ?? t.a; moved += ga; const n = {id: t.id, t: "goal", g: g.id, gd: 1, a: t.a, ga, acc: t.acc, date: t.date, n: t.n || "", ts: t.ts}; if (t.r) n.r = t.r; return n; }
      if (t.t === "tr" && t.acc === a.id && t.to !== a.id) { ch = true; moved -= t.a; const n = {id: t.id, t: "goal", g: g.id, gd: -1, a: t.ta ?? t.a, ga: t.a, acc: t.to, date: t.date, n: t.n || "", ts: t.ts}; return n; }
      if (t.acc === a.id || t.to === a.id) { ch = true; const n = {...t}; if (n.acc === a.id) n.acc = ""; if (n.to === a.id) n.to = ""; return n; }
      return t;
    });
    if (ch) persistMonth(k);
  }
  g.start = Math.round((bal - moved) * 100) / 100;
  S.settings.goals.push(g);
  S.settings.accounts = S.settings.accounts.filter(x => x.id !== a.id);
  if (ui.lastAcc === a.id) ui.lastAcc = "";
  bump(); persistSettings();
}
