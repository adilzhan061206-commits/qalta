      closeSheet(); toast("Қарыз жазылды");
    };
    const del = $("#d-del", b); if (del) del.onclick = e => armDelete(e.currentTarget, () => { removeTxWhere(t => t.t === "debt" && t.d === d.id); S.settings.debts = S.settings.debts.filter(x => x.id !== d.id); commitSettings(); closeSheet(); });
  });
  draw();
}
function openRepay(id){
  const d = debt(id); if (!d) return; const left = d.amount - debtRepaid(d);
  openSheet(d.dir === "lent" ? `${d.person} қайтарды` : `${d.person}-ге қайтардым`, `
    <div class="field"><label for="p-amt">Сома, ₸ (қалғаны ${fmt(left)})</label><input class="inp big num" id="p-amt" inputmode="decimal" value="${Math.round(left * 100) / 100}"></div>
    <div class="field"><label for="p-acc">${d.dir === "lent" ? "Қай шотқа түсті" : "Қай шоттан"}</label><select class="inp" id="p-acc">${accOptions(defAcc(), true, "Шотқа әсер етпесін")}</select></div>
    <div class="err" id="p-err"></div><button class="btn primary block" id="p-save">Сақтау</button>`, b => {
    $("#p-save", b).onclick = () => {
      const a = parseAmt($("#p-amt", b).value); if (!(a > 0)) { $("#p-err", b).textContent = "Соманы енгізіңіз."; return; }
      if (a >= left - 0.01) { d.closed = true; persistSettings(); }
      upsertTx({id: uid(), t: "debt", d: d.id, rep: true, s: d.dir === "lent" ? 1 : -1, a: Math.min(a, left), acc: $("#p-acc", b).value, date: today(), n: ""});
      closeSheet(); toast(d.closed ? "Қарыз жабылды" : "Жазылды");
    };
  });
}

/* category editor */
function openCat(id, type){
  const c = id ? cat(id) : null; type = c ? c.type : type || "exp";
  let group = c ? c.group || "want" : "need";
  const used = c ? allTx().some(t => t.c === c.id) : false;
  const draw = () => openSheet(c ? "Санатты өзгерту" : "Жаңа санат", `
    <div class="frow" style="grid-template-columns:80px 1fr"><div class="field"><label for="c-icon">Белгі</label><input class="inp" id="c-icon" maxlength="4" value="${esc(c ? c.icon : "🏷️")}" style="text-align:center;font-size:20px"></div><div class="field"><label for="c-name">Атауы</label><input class="inp" id="c-name" value="${esc(c ? c.name : "")}"></div></div>
    ${type === "exp" ? `<div class="field"><span class="flabel">Түрі (50/30/20 талдауы үшін)</span><div class="seg">${[["need","Қажеттілік"],["want","Қалау"]].map(([v, l]) => `<button data-cg="${v}" aria-pressed="${group === v}">${l}</button>`).join("")}</div><span class="small muted">Қажеттілік — онсыз болмайтын шығын (тамақ, пәтер, жол). Қалау — бас тартуға болатын шығын.</span></div>` : ""}
    <div class="err" id="c-err"></div>
    <button class="btn primary block" id="c-save">Сақтау</button>
    ${c && !used ? `<button class="btn danger block" id="c-del">Санатты өшіру</button>` : c ? `<span class="small muted">Бұл санатта операциялар бар, сондықтан оны өшіруге болмайды.</span>` : ""}`, b => {
    $$("[data-cg]", b).forEach(x => x.onclick = () => { group = x.dataset.cg; $$("[data-cg]", b).forEach(y => y.setAttribute("aria-pressed", y === x)); });
    $("#c-save", b).onclick = () => {
      const name = $("#c-name", b).value.trim(); if (!name) { $("#c-err", b).textContent = "Атауын жазыңыз."; return; }
      const data = {name, icon: $("#c-icon", b).value.trim() || "🏷️", type}; if (type === "exp") data.group = group;
      if (c) Object.assign(c, data); else S.settings.cats.push({id: uid(), ...data});
      commitSettings(); closeSheet();
    };
    const del = $("#c-del", b); if (del) del.onclick = e => armDelete(e.currentTarget, () => { S.settings.cats = S.settings.cats.filter(x => x.id !== c.id); delete S.settings.budgets[c.id]; commitSettings(); closeSheet(); });
  });
  draw();
}

/* ---------- demo data ---------- */
function demoState(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const r = (a, b) => Math.round((a + rnd() * (b - a)) / 10) * 10;
  const st = defaults();
  st.accounts = [{id: "card", name: "Kaspi Gold", icon: "💳", initial: 84000}, {id: "cash", name: "Қолма-қол", icon: "💵", initial: 95000}, {id: "dep", name: "Долларлық шот", icon: "🏦", initial: 300, cur: "USD"}];
  st.budgets = {cafe: 30000, taxi: 15000, fun: 20000};
  st.goals = [{id: "g1", name: "Жаңа ноутбук", icon: "💻", target: 450000, deadline: shiftMonth(curMonth(), 5) + "-01", rate: 0, start: 90000, created: today()},
              {id: "g2", name: "Қауіпсіздік қоры", icon: "🛡️", target: 600000, deadline: shiftMonth(curMonth(), 12) + "-01", rate: 14, start: 150000, created: today()},
              {id: "g3", name: "Долларлық депозит", icon: "💵", target: 5000, deadline: shiftMonth(curMonth(), 18) + "-01", rate: 1, start: 1200, created: today(), cur: "USD"}];
  st.recurring = [{id: "r1", name: "Пәтер ақысы", a: 120000, day: 1, type: "exp", c: "home", acc: "card", last: ""},
                  {id: "r2", name: "Үй интернеті", a: 6990, day: 10, type: "exp", c: "phone", acc: "card", last: ""},
                  {id: "r3", name: "Музыка жазылымы", a: 1490, day: new Date().getDate() + 1 > 28 ? 28 : new Date().getDate() + 1, type: "exp", c: "subs", acc: "card", last: ""}];
  st.debts = [{id: "d1", person: "Айбек", amount: 15000, dir: "lent", date: dstr(new Date(Date.now() - 12 * 864e5)), due: dstr(new Date(Date.now() - 864e5)), note: "", closed: false}];
  const months = {}; const add = t => { t.id = uid() + Math.floor(rnd() * 1e6); t.ts = Date.now() - rnd() * 1e9; (months[mkey(t.date)] = months[mkey(t.date)] || []).push(t); };
  const cm = curMonth(), td = new Date().getDate();
  for (let back = 3; back >= 0; back--) {
    const k = shiftMonth(cm, -back), last = back ? daysIn(k) : td, D = d => `${k}-${pad(d)}`;
    add({t: "inc", a: 380000, c: "salary", acc: "card", date: D(Math.min(5, last)), n: ""});
    if (back) { add({t: "exp", a: 120000, c: "home", acc: "card", date: D(1), n: "Пәтер ақысы"}); add({t: "exp", a: 6990, c: "phone", acc: "card", date: D(10), n: "Интернет"}); add({t: "exp", a: 1490, c: "subs", acc: "card", date: D(15), n: ""}); }
    else { add({t: "exp", a: 120000, c: "home", acc: "card", date: D(1), n: "Пәтер ақысы"}); if (td >= 10) add({t: "exp", a: 6990, c: "phone", acc: "card", date: D(10), n: "Интернет"}); }
    if (last >= 6) add({t: "goal", g: back % 2 ? "g1" : "g2", gd: 1, a: 40000 + back * 5000, acc: "card", date: D(6), n: ""});
    if (last >= 20) add({t: "exp", a: r(8000, 25000), c: "clothes", acc: "card", date: D(20), n: ""});
    for (let d = 1; d <= last; d++) {
      if (rnd() < .55) add({t: "exp", a: r(2500, 11000), c: "food", acc: rnd() < .8 ? "card" : "cash", date: D(d), n: rnd() < .3 ? "Magnum" : ""});
      if (rnd() < .45) add({t: "exp", a: r(1500, 6500) + (back === 0 ? 800 : 0), c: "cafe", acc: "card", date: D(d), n: rnd() < .3 ? "Кофе" : ""});
      if (rnd() < .5) add({t: "exp", a: 200, c: "transport", acc: "card", date: D(d), n: "Автобус"});
      if (rnd() < .18) add({t: "exp", a: r(1200, 3200), c: "taxi", acc: "card", date: D(d), n: ""});
      if (rnd() < .07) add({t: "exp", a: r(3000, 12000), c: "fun", acc: "card", date: D(d), n: "Кино"});
      if (rnd() < .04) add({t: "exp", a: r(2000, 9000), c: "health", acc: "card", date: D(d), n: "Дәріхана"});
      if (rnd() < .05) add({t: "inc", a: r(500, 2500), c: "cashback", acc: "card", date: D(d), n: ""});
    }
    if (last >= 18 && back % 2 === 0) add({t: "inc", a: 45000, c: "side", acc: "card", date: D(18), n: "Фриланс"});
  }
  add({t: "debt", d: "d1", s: -1, a: 15000, acc: "cash", date: st.debts[0].date, n: ""});
  { const sd = dstr(new Date(Date.now() - 2 * 864e5)), people = [["Айгерім", 9000, true], ["Нұрлан", 9000, false], ["Дана", 9000, false]];
    st.splits.push({id: "s1", title: "Del Papa", date: sd, total: 36000, c: "cafe", me: 9000, mode: "eq", payer: "me", acc: "card", people: people.map(([name, share], i) => ({name, share, d: "sd" + i}))});
    add({t: "exp", a: 9000, c: "cafe", acc: "card", date: sd, n: "Del Papa", split: "s1"});
    people.forEach(([name, share, paid], i) => { st.debts.push({id: "sd" + i, person: name, amount: share, dir: "lent", date: sd, due: "", note: "Del Papa", closed: paid, split: "s1"}); add({t: "debt", d: "sd" + i, s: -1, a: share, acc: "card", date: sd, n: "Del Papa", split: "s1"}); if (paid) add({t: "debt", d: "sd" + i, rep: true, s: 1, a: share, acc: "card", date: today(), n: "Del Papa"}); }); }
  st.recurring[0].last = cm; if (td >= 10) st.recurring[1].last = cm;
  return {settings: st, months};
}

/* ---------- export / import / wipe ---------- */
function doExport(){
  const msg = $("#io-msg");
  const data = JSON.stringify({app: "qalta", v: 1, exported: new Date().toISOString(), settings: (saved || S).settings, months: (saved || S).months}, null, 1);
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));
    a.download = `qalta-${today()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    if (msg) { msg.style.color = "var(--pos)"; msg.textContent = "Көшірме жүктелді."; }
  } catch { if (msg) msg.textContent = "Жүктеу сәтсіз аяқталды. Қайталап көріңіз."; }
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch { toast("Файл оқылмады: JSON емес."); return; }
    if (!d || !d.settings || typeof d.months !== "object") { toast("Бұл Қалта көшірмесі емес."); return; }
    openSheet("Көшірмеден қалпына келтіру", `<p style="margin:0">Файлда ${Object.values(d.months).flat().length} операция бар. Қазіргі деректер осы көшірмемен ауыстырылады.</p><button class="btn primary block" id="imp-ok">Ауыстыру</button><button class="btn ghost block" data-act="closeSheet">Бас тарту</button>`, b => {
      $("#imp-ok", b).onclick = () => {
        if (mode === "demo") exitDemo();
        const oldKeys = Object.keys(S.months);
        S.settings = normalize(d.settings); S.months = {};
        for (const [k, v] of Object.entries(d.months)) if (/^\d{4}-\d{2}$/.test(k) && Array.isArray(v)) S.months[k] = v;
        for (const k of oldKeys) if (!S.months[k]) { S.months[k] = []; persistMonth(k); }
        for (const k of Object.keys(S.months)) persistMonth(k);
        persistSettings(); bump(); closeSheet(); render(); toast("Қалпына келтірілді");
      };
    });
  };
  r.readAsText(file);
}
function wipe(){
  if (mode === "demo") exitDemo();
  const keys = Object.keys(S.months);
  S.settings = defaults(); S.months = {};
  for (const k of keys) { S.months[k] = []; persistMonth(k); }
  persistSettings(); bump(); render(); toast("Барлық деректер өшірілді");
}
function enterDemo(){ if (mode === "demo") return; saved = {settings: S.settings, months: S.months, mode}; const d = demoState(); S.settings = d.settings; S.months = d.months; mode = "demo"; ui.sub = null; ui.tab = "home"; bump(); render(); window.scrollTo(0, 0); }
function exitDemo(){ if (mode !== "demo" || !saved) return; S.settings = saved.settings; S.months = saved.months; mode = saved.mode; saved = null; bump(); render(); pull(); }

/* ---------- events ---------- */
const ACT = {
  tab: el => { ui.tab = el.dataset.tab; ui.sub = null; closeSheet(); render(); window.scrollTo(0, 0); },
  newTx: el => openTx(null, el.dataset.type, el.dataset.c ? {c: el.dataset.c} : null),
  newSplit: () => openSplit(),
  anView: el => { ui.anView = el.dataset.v; render(); window.scrollTo(0, 0); },
  nsTarget: el => { S.settings.challenges.nospend = +el.dataset.v; commitSettings(); },
  w52Start: () => { const step = +(($("#w52-step") || {}).value) || 1000, id = uid(); S.settings.goals.push({id, name: "52 апта челленджі", icon: "🐷", target: step * 1378, deadline: dstr(new Date(Date.now() + 364 * 864e5)), rate: 0, start: 0, created: today(), cur: "KZT"}); S.settings.challenges.w52 = {start: today(), step, goal: id}; commitSettings(); toast("Челлендж басталды! 1-аптада " + fmt(step) + " салыңыз"); },
  w52Pay: el => { const w = S.settings.challenges.w52; if (w) openGoalMove(w.goal, 1, false, +el.dataset.a); },
  w52Stop: el => armDelete(el, () => { delete S.settings.challenges.w52; commitSettings(); toast("Челлендж тоқтатылды, жиналған ақша мақсатта қалды"); }, "Иә, тоқтату"),
  addSubRec: el => { const g = subsSug[+el.dataset.i]; if (!g) return; S.settings.recurring.push({id: uid(), name: g.name, a: g.a, day: Math.min(28, g.day), type: "exp", c: g.c, acc: g.acc, last: g.months.has(curMonth()) ? curMonth() : ""}); commitSettings(); toast("Тұрақты төлемге қосылды"); },
  viewSplit: el => openSplitView(el.dataset.id),
  editTx: el => { const t = (S.months[el.dataset.m] || []).find(x => x.id === el.dataset.id); if (t) openTx(t); },
  closeSheet: () => closeSheet(),
  opsMonth: el => { ui.opsMonth = shiftMonth(ui.opsMonth, +el.dataset.d); render(); },
  anMonth: el => { ui.anMonth = shiftMonth(ui.anMonth, +el.dataset.d); render(); },
  opsType: el => { ui.opsType = el.dataset.v; render(); },
  editAcc: el => openAcc(el.dataset.id),
  editGoal: el => openGoal(el.dataset.id),
  goalMove: el => openGoalMove(el.dataset.id, +el.dataset.d),
  goalInterest: el => openGoalMove(el.dataset.id, 1, true),
  goSub: el => { ui.tab = "more"; ui.sub = el.dataset.sub || null; render(); window.scrollTo(0, 0); },
  goDebts: () => { ui.tab = "more"; ui.sub = "debts"; render(); window.scrollTo(0, 0); },
  editRec: el => openRec(el.dataset.id),
  payRec: el => { const r = S.settings.recurring.find(x => x.id === el.dataset.id); if (!r) return; r.last = curMonth(); persistSettings(); upsertTx({id: uid(), t: r.type, a: r.a, c: r.c, acc: acc(r.acc) ? r.acc : defAcc(), date: today(), n: r.name, rec: r.id}); toast("Жазылды"); },
  skipRec: el => { const r = S.settings.recurring.find(x => x.id === el.dataset.id); if (!r) return; r.last = curMonth(); commitSettings(); },
  editDebt: el => openDebt(el.dataset.id),
  repay: el => openRepay(el.dataset.id),
  editCat: el => openCat(el.dataset.id, el.dataset.type),
  theme: el => { lsSet("qalta-theme", el.dataset.v); if (el.dataset.v === "system") { document.documentElement.removeAttribute("data-theme"); delete document.documentElement.dataset.qaltaTheme; } applyTheme(); render(); },
  export: () => doExport(),
  import: () => $("#import-file").click(),
  wipe: el => armDelete(el, wipe),
  demo: () => enterDemo(),
  exitDemo: () => exitDemo(),
  refreshRates: async el => { el.disabled = true; el.textContent = "Жүктелуде…"; const ok = await fetchRates(true); toast(ok ? "Бағам жаңартылды" : "Бағамды жүктеу мүмкін болмады. Интернетті тексеріңіз."); render(); },
  login: () => { try { localStorage.removeItem("qalta-skip-auth"); } catch {} mode = "auth"; render(); window.scrollTo(0, 0); },
  logout: el => armDelete(el, signOut, "Иә, шығу")
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("input", e => {
  if (e.target.id === "ops-q") { ui.opsQ = e.target.value; clearTimeout(ACT._q); ACT._q = setTimeout(() => { render(); const q = $("#ops-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ops-cat") { ui.opsCat = t.value; render(); }
  else if (t.dataset && t.dataset.work) { const v = parseAmt(t.value); if (isFinite(v) && v > 0) S.settings.work[t.dataset.work] = v; else delete S.settings.work[t.dataset.work]; commitSettings(); }
  else if (t.dataset && t.dataset.rate) { const v = parseAmt(t.value); if (isFinite(v) && v > 0) S.settings.rates[t.dataset.rate] = v; else delete S.settings.rates[t.dataset.rate]; commitSettings(); }
  else if (t.dataset && t.dataset.bud) { const v = parseAmt(t.value); if (isFinite(v) && v > 0) S.settings.budgets[t.dataset.bud] = v; else delete S.settings.budgets[t.dataset.bud]; commitSettings(); }
  else if (t.id === "import-file") { if (t.files && t.files[0]) doImport(t.files[0]); t.value = ""; }
});
/* tooltip */
const tip = $("#tip");
function showTip(el, x, y){ tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; tip.style.left = Math.max(80, Math.min(window.innerWidth - 80, x)) + "px"; tip.style.top = y + "px"; }
document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener("pointerdown", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType !== "mouse") showTip(el, e.clientX, e.clientY); else if (!el) tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });

boot();
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
